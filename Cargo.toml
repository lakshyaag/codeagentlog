[package]
name = "codeagentlog"
version = "0.2.0"
authors=["Lakshya Agarwal <lakshyaag1202@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Find and read past coding-agent conversations (pi, Claude Code, Codex, Cursor)"
repository = "https://github.com/lakshyaag/codeagentlog"
homepage = "https://github.com/lakshyaag/codeagentlog"
license = "MIT"
readme = "README.md"
keywords = ["cli", "agents", "claude", "codex", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cliclack = "0.5.6"
jiff = { version = "0.2.38", features = ["serde"] }
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 4

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
